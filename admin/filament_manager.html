<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#111827" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Filament Manager – Schicht für Schicht 3D</title>
  <link rel="manifest" id="pwa-manifest" />
  <script src="https://unpkg.com/html5-qrcode@2.3.8"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #3b82f6;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }
    header {
      background: #111827;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    header h1 { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 14px;
      cursor: pointer;
    }
    .container { max-width: 540px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card h2 { font-size: 15px; font-weight: 600; color: var(--text); }
    #reader-container {
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      display: none;
    }
    #reader-container.active { display: block; }
    .btn {
      border: none;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      transition: opacity 0.15s;
    }
    .btn:active { opacity: 0.8; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); }
    .btn-success { background: var(--success); }
    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #334155; }
    .row { display: flex; gap: 8px; align-items: center; }
    .row > * { flex: 1; }
    input, select {
      width: 100%;
      background: #0f172a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
    }
    label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 4px; }
    .status-banner {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--muted);
      line-height: 1.4;
    }
    .status-banner.ok { border-color: var(--success); color: #6ee7b7; }
    .status-banner.err { border-color: var(--danger); color: #fca5a5; }
    .filament-item {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .color-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #fff;
      flex-shrink: 0;
    }
    .fil-info { flex: 1; min-width: 0; }
    .fil-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fil-meta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .qty-controls { display: flex; align-items: center; gap: 6px; }
    .qty-btn {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<header>
  <h1>📷 Filament Manager</h1>
  <div style="display:flex; gap:8px;">
    <a href="./admin/" class="icon-btn" style="text-decoration:none;" title="Zurück zum Admin-Panel">🛠️ Admin</a>
    <button class="icon-btn" id="btn-sync" title="Mit GitHub synchronisieren">🔄 Sync</button>
    <button class="icon-btn" id="btn-settings" title="Einstellungen">⚙️</button>
  </div>
</header>

<div class="container">
  <div id="global-status" class="status-banner">Lade Filament-Sortiment...</div>

  <div id="settings-card" class="card hidden">
    <h2>⚙️ GitHub & KI-Verbindung</h2>
    <div>
      <label>GitHub Repository (Besitzer/Repo)</label>
      <input type="text" id="cfg-repo" value="hac52/homepage-demo" />
    </div>
    <div>
      <label>Branch</label>
      <input type="text" id="cfg-branch" value="main" />
    </div>
    <div>
      <label>GitHub Personal Access Token (für Schreibzugriff auf filamente.json)</label>
      <input type="password" id="cfg-token" placeholder="github_pat_... oder ghp_..." />
    </div>
    <div>
      <label>LM Studio Tailscale-URL (für KI-Etikettenerkennung)</label>
      <input type="text" id="cfg-ai-url" value="https://desktop-uvddnig.tail1dcff0.ts.net/v1" />
    </div>
    <button class="btn btn-primary" id="btn-save-settings">Einstellungen speichern</button>
  </div>

  <div class="card">
    <h2>1. Barcode oder QR-Code scannen</h2>
    <div id="reader-container">
      <div id="qr-reader" style="width:100%;"></div>
    </div>
    <div class="row">
      <button class="btn btn-primary" id="btn-start-scan">📷 Kamera starten</button>
      <button class="btn btn-danger hidden" id="btn-stop-scan">⏹️ Stopp</button>
    </div>
    <div class="row">
      <input type="text" id="manual-barcode" placeholder="Oder Barcode manuell eingeben..." />
      <button class="btn btn-secondary" id="btn-lookup-barcode" style="flex:0 0 auto;">Suchen</button>
    </div>
  </div>

  <div id="scan-result-card" class="card hidden">
    <h2 id="scan-result-title">Gescanntes Filament</h2>
    <div style="font-size:12px; color:var(--muted);">Barcode: <strong id="active-barcode-label">-</strong></div>

    <div id="existing-match-box" class="hidden" style="display:flex; flex-direction:column; gap:10px;">
      <div class="filament-item">
        <span class="color-dot" id="match-dot"></span>
        <div class="fil-info">
          <div class="fil-title" id="match-name">-</div>
          <div class="fil-meta" id="match-meta">-</div>
        </div>
        <div class="qty-controls">
          <button class="qty-btn" id="btn-dec-match" type="button">−</button>
          <button class="qty-btn" id="btn-inc-match" type="button">+</button>
        </div>
      </div>
    </div>

    <div id="unassigned-barcode-box" class="hidden" style="display:flex; flex-direction:column; gap:12px;">
      <p style="font-size:13px; color:#fbbf24;">Dieser Barcode ist noch keinem Filament zugeordnet.</p>

      <div>
        <label>Option A: Mit bestehendem Filament verknüpfen</label>
        <div class="row">
          <select id="link-existing-select"></select>
          <button class="btn btn-primary" id="btn-link-existing" style="flex:0 0 auto;" type="button">Verknüpfen</button>
        </div>
      </div>

      <hr style="border:none; border-top:1px solid var(--border);" />

      <div style="display:flex; flex-direction:column; gap:8px;">
        <label>Option B: Neu anlegen (optional Etikett fotografieren für KI)</label>
        <input type="file" id="ki-label-photo" accept="image/*" capture="environment" />
        <button type="button" class="btn btn-secondary" id="btn-ki-scan-label">✨ Etikett mit KI auslesen</button>

        <input type="text" id="new-fil-name" placeholder="Name / Farbe (z. B. Bambu PLA Matt Schwarz)" />
        <div class="row">
          <input type="text" id="new-fil-material" value="PLA" placeholder="Material (PLA, PETG...)" />
          <input type="color" id="new-fil-color" value="#3b82f6" style="height:42px; padding:4px; flex:0 0 60px;" />
        </div>
        <input type="text" id="new-fil-status" value="Auf Lager (1x)" placeholder="Status (z. B. Auf Lager (1x))" />
        <input type="text" id="new-fil-notiz" placeholder="Notiz / Hersteller (optional)" />
        <button type="button" class="btn btn-success" id="btn-create-new-fil">Speichern & Barcode verknüpfen</button>
      </div>
    </div>
  </div>

  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2>2. Aktueller Bestand (<span id="fil-count">0</span>)</h2>
      <input type="text" id="search-list" placeholder="Filtern..." style="width:140px; padding:6px 10px; font-size:13px;" />
    </div>
    <div id="filament-list" style="display:flex; flex-direction:column; gap:8px;"></div>
  </div>
</div>

<script>
  const manifestObj = {
    name: "Filament-Scanner – Schicht für Schicht 3D",
    short_name: "Filament-Scan",
    start_url: "./admin/filament_manager.html",
    display: "standalone",
    background_color: "#0f172a",
    theme_color: "#111827"
  };
  document.getElementById("pwa-manifest").setAttribute(
    "href",
    "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifestObj))
  );

  let filamente = [];
  let fileSha = null;
  let activeBarcode = "";
  let matchedIndex = -1;
  let html5QrCode = null;
  let isScanning = false;

  const statusBanner = document.getElementById("global-status");
  const settingsCard = document.getElementById("settings-card");

  function setStatus(msg, type = "") {
    statusBanner.textContent = msg;
    statusBanner.className = "status-banner " + type;
  }

  function getConfig() {
    return {
      repo: localStorage.getItem("sfs_gh_repo") || "hac52/homepage-demo",
      branch: localStorage.getItem("sfs_gh_branch") || "main",
      token: localStorage.getItem("sfs_gh_token") || "",
      aiUrl: localStorage.getItem("sfs_ai_url") || "https://desktop-uvddnig.tail1dcff0.ts.net/v1"
    };
  }

  function loadSettingsUI() {
    const cfg = getConfig();
    document.getElementById("cfg-repo").value = cfg.repo;
    document.getElementById("cfg-branch").value = cfg.branch;
    document.getElementById("cfg-token").value = cfg.token;
    document.getElementById("cfg-ai-url").value = cfg.aiUrl;

    if (!cfg.token) {
      settingsCard.classList.remove("hidden");
      setStatus("Hinweis: Bitte hinterlege einmalig deinen GitHub-Token unter ⚙️, damit Änderungen gespeichert werden können.", "err");
    }
  }

  document.getElementById("btn-settings").addEventListener("click", () => {
    settingsCard.classList.toggle("hidden");
  });

  document.getElementById("btn-save-settings").addEventListener("click", () => {
    localStorage.setItem("sfs_gh_repo", document.getElementById("cfg-repo").value.trim());
    localStorage.setItem("sfs_gh_branch", document.getElementById("cfg-branch").value.trim());
    localStorage.setItem("sfs_gh_token", document.getElementById("cfg-token").value.trim());
    localStorage.setItem("sfs_ai_url", document.getElementById("cfg-ai-url").value.trim());
    settingsCard.classList.add("hidden");
    setStatus("Einstellungen gespeichert!", "ok");
    loadFilamenteFromGitHub();
  });

  function utf8ToBase64(str) {
    return btoa(unescape(encodeURIComponent(str)));
  }

  function base64ToUtf8(base64) {
    const cleaned = (base64 || "").replace(/\n/g, "");
    return decodeURIComponent(escape(atob(cleaned)));
  }

  async function loadFilamenteFromGitHub() {
    const cfg = getConfig();
    setStatus("Lade filamente.json...");

    try {
      let parsed;

      if (cfg.token) {
        const url = `https://api.github.com/repos/${cfg.repo}/contents/filamente.json?ref=${encodeURIComponent(cfg.branch)}&t=${Date.now()}`;
        const res = await fetch(url, {
          headers: {
            Authorization: `Bearer ${cfg.token}`,
            Accept: "application/vnd.github+json"
          }
        });

        if (!res.ok) {
          throw new Error("GitHub API Fehler " + res.status);
        }

        const data = await res.json();
        fileSha = data.sha;
        parsed = JSON.parse(base64ToUtf8(data.content));
      } else {
        const res = await fetch("./filamente.json?t=" + Date.now());
        if (!res.ok) {
          throw new Error("HTTP " + res.status + " beim Laden von filamente.json");
        }
        parsed = await res.json();
      }

      filamente = Array.isArray(parsed.filamente) ? parsed.filamente : [];
      renderFilamentList();
      setStatus(`Bereit (${filamente.length} Filamente geladen).`, "ok");
    } catch (err) {
      console.error(err);
      setStatus("Fehler beim Laden: " + err.message, "err");
    }
  }

  async function saveFilamenteToGitHub(commitMsg = "Bestand per Barcode-Scanner aktualisiert") {
    const cfg = getConfig();

    if (!cfg.token) {
      settingsCard.classList.remove("hidden");
      setStatus("Speichern fehlgeschlagen: Bitte zuerst GitHub-Token in den Einstellungen eintragen.", "err");
      return false;
    }

    setStatus("Speichere Änderung auf GitHub...");

    try {
      if (!fileSha) {
        const checkUrl = `https://api.github.com/repos/${cfg.repo}/contents/filamente.json?ref=${encodeURIComponent(cfg.branch)}`;
        const check = await fetch(checkUrl, {
          headers: {
            Authorization: `Bearer ${cfg.token}`,
            Accept: "application/vnd.github+json"
          }
        });
        if (check.ok) {
          const d = await check.json();
          fileSha = d.sha;
        }
      }

      const jsonContent = JSON.stringify({ filamente }, null, 2);
      const apiUrl = `https://api.github.com/repos/${cfg.repo}/contents/filamente.json`;
      const res = await fetch(apiUrl, {
        method: "PUT",
        headers: {
          Authorization: `Bearer ${cfg.token}`,
          Accept: "application/vnd.github+json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          message: commitMsg,
          content: utf8ToBase64(jsonContent),
          sha: fileSha,
          branch: cfg.branch
        })
      });

      if (!res.ok) {
        const errData = await res.json().catch(() => ({}));
        throw new Error(errData.message || "HTTP " + res.status);
      }

      const result = await res.json();
      fileSha = result.content && result.content.sha ? result.content.sha : fileSha;
      renderFilamentList();
      if (matchedIndex >= 0) {
        showMatchedCard(matchedIndex);
      }
      setStatus("Gespeichert! Bestand auf GitHub aktualisiert.", "ok");
      return true;
    } catch (err) {
      console.error(err);
      fileSha = null;
      setStatus("Speicherfehler: " + err.message, "err");
      return false;
    }
  }

  function adjustQuantity(index, delta) {
    const item = filamente[index];
    if (!item) return;

    const currentStr = item.verfuegbar || "Auf Lager (1x)";
    const match = currentStr.match(/(\d+)\s*x/i);
    let qty = match ? parseInt(match[1], 10) : (currentStr.toLowerCase().includes("leer") ? 0 : 1);
    qty = Math.max(0, qty + delta);

    if (qty === 0) {
      item.verfuegbar = "Leer";
    } else if (qty === 1) {
      item.verfuegbar = "Wenig Bestand (1x)";
    } else {
      item.verfuegbar = `Auf Lager (${qty}x)`;
    }

    saveFilamenteToGitHub(`${item.name}: ${item.verfuegbar}`);
  }

  function renderFilamentList() {
    const listEl = document.getElementById("filament-list");
    const selectEl = document.getElementById("link-existing-select");
    const filter = document.getElementById("search-list").value.toLowerCase();

    document.getElementById("fil-count").textContent = filamente.length;
    listEl.innerHTML = "";
    selectEl.innerHTML = "";

    filamente.forEach((f, idx) => {
      const opt = document.createElement("option");
      opt.value = String(idx);
      opt.textContent = `${f.name} (${f.material || "PLA"})`;
      selectEl.appendChild(opt);

      const searchText = `${f.name || ""} ${f.material || ""} ${f.barcode || ""}`.toLowerCase();
      if (filter && !searchText.includes(filter)) {
        return;
      }

      const row = document.createElement("div");
      row.className = "filament-item";
      row.innerHTML = `
        <span class="color-dot" style="background:${f.farbcode || "#64748b"};"></span>
        <div class="fil-info">
          <div class="fil-title">${f.name || "Unbenannt"}</div>
          <div class="fil-meta">${f.material || "PLA"} • ${f.verfuegbar || "Auf Lager"}</div>
        </div>
      `;
      listEl.appendChild(row);
    });
  }

  document.getElementById("search-list").addEventListener("input", renderFilamentList);
  document.getElementById("btn-sync").addEventListener("click", loadFilamenteFromGitHub);

  function handleScannedCode(code) {
    activeBarcode = String(code || "").trim();
    if (!activeBarcode) return;

    document.getElementById("scan-result-card").classList.remove("hidden");
    document.getElementById("active-barcode-label").textContent = activeBarcode;

    matchedIndex = filamente.findIndex((f) => String(f.barcode || "").trim() === activeBarcode);

    if (matchedIndex >= 0) {
      showMatchedCard(matchedIndex);
      setStatus(`Barcode erkannt: ${filamente[matchedIndex].name}`, "ok");
    } else {
      document.getElementById("scan-result-title").textContent = "Neuer Barcode erkannt";
      document.getElementById("existing-match-box").classList.add("hidden");
      document.getElementById("unassigned-barcode-box").classList.remove("hidden");
      setStatus("Unbekannter Barcode – bitte zuordnen oder neu anlegen.");
    }
  }

  function showMatchedCard(idx) {
    const item = filamente[idx];
    if (!item) return;

    document.getElementById("scan-result-title").textContent = "Gefundenes Filament";
    document.getElementById("unassigned-barcode-box").classList.add("hidden");
    document.getElementById("existing-match-box").classList.remove("hidden");
    document.getElementById("match-dot").style.background = item.farbcode || "#64748b";
    document.getElementById("match-name").textContent = item.name;
    document.getElementById("match-meta").textContent = `${item.material || "PLA"} • ${item.verfuegbar || "Auf Lager"}`;
  }

  document.getElementById("btn-dec-match").addEventListener("click", () => {
    if (matchedIndex >= 0) adjustQuantity(matchedIndex, -1);
  });

  document.getElementById("btn-inc-match").addEventListener("click", () => {
    if (matchedIndex >= 0) adjustQuantity(matchedIndex, 1);
  });

  document.getElementById("btn-link-existing").addEventListener("click", async () => {
    const idx = parseInt(document.getElementById("link-existing-select").value, 10);
    if (Number.isNaN(idx) || !filamente[idx]) return;

    filamente[idx].barcode = activeBarcode;
    matchedIndex = idx;
    await saveFilamenteToGitHub(`Barcode ${activeBarcode} mit ${filamente[idx].name} verknüpft`);
  });

  document.getElementById("btn-create-new-fil").addEventListener("click", async () => {
    const name = document.getElementById("new-fil-name").value.trim();
    if (!name) {
      setStatus("Bitte mindestens einen Namen für das Filament eingeben.", "err");
      return;
    }

    const newItem = {
      name,
      material: document.getElementById("new-fil-material").value.trim() || "PLA",
      farbcode: document.getElementById("new-fil-color").value,
      verfuegbar: document.getElementById("new-fil-status").value.trim() || "Auf Lager (1x)",
      notiz: document.getElementById("new-fil-notiz").value.trim(),
      barcode: activeBarcode
    };

    filamente.push(newItem);
    matchedIndex = filamente.length - 1;
    await saveFilamenteToGitHub(`Neues Filament per Scanner angelegt: ${name}`);
  });

  document.getElementById("btn-ki-scan-label").addEventListener("click", async () => {
    const fileInput = document.getElementById("ki-label-photo");
    const file = fileInput.files && fileInput.files[0];
    if (!file) {
      setStatus("Bitte zuerst ein Foto vom Spulen-Etikett aufnehmen/auswählen.", "err");
      return;
    }

    const btn = document.getElementById("btn-ki-scan-label");
    btn.disabled = true;
    setStatus("KI liest Spulen-Etikett aus...");

    try {
      const base64 = await new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const scale = Math.min(1, 800 / img.width);
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", 0.85));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });

      const cfg = getConfig();
      const apiUrl = `${cfg.aiUrl.replace(/\/+$/, "")}/chat/completions`;
      const res = await fetch(apiUrl, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          model: "google/gemma-4-e4b",
          messages: [
            {
              role: "system",
              content: 'Lese das 3D-Druck-Filament-Etikett aus und antworte NUR mit JSON ohne Markdown: {"name":"Farbe (Hersteller)","material":"PLA oder PETG","farbcode":"#HexWert","notiz":"Besonderheit"}'
            },
            {
              role: "user",
              content: [
                { type: "text", text: "Erkenne Hersteller, Farbname, Material und passenden Hex-Farbcode auf dieser Spule." },
                { type: "image_url", image_url: { url: base64 } }
              ]
            }
          ],
          temperature: 0.2
        })
      });

      const data = await res.json();
      const raw = (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || "";
      const cleaned = raw.replace(/```json|```/gi, "").trim();
      const parsed = JSON.parse(cleaned);

      document.getElementById("new-fil-name").value = parsed.name || "";
      document.getElementById("new-fil-material").value = parsed.material || "PLA";
      if (/^#[0-9A-Fa-f]{6}$/.test(parsed.farbcode)) {
        document.getElementById("new-fil-color").value = parsed.farbcode;
      }
      document.getElementById("new-fil-notiz").value = parsed.notiz || "";
      setStatus("Etikett erkannt! Jetzt prüfen und speichern.", "ok");
    } catch (err) {
      console.error(err);
      setStatus("KI-Erkennung fehlgeschlagen (LM Studio erreichbar?).", "err");
    } finally {
      btn.disabled = false;
    }
  });

  const startBtn = document.getElementById("btn-start-scan");
  const stopBtn = document.getElementById("btn-stop-scan");
  const readerContainer = document.getElementById("reader-container");

  startBtn.addEventListener("click", async () => {
    try {
      readerContainer.classList.add("active");
      startBtn.classList.add("hidden");
      stopBtn.classList.remove("hidden");
      setStatus("Starte Rückkamera...");

      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("qr-reader");
      }

      await html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 250, height: 150 } },
        (decodedText) => {
          if (navigator.vibrate) navigator.vibrate(100);
          stopScanner();
          handleScannedCode(decodedText);
        },
        () => {}
      );

      isScanning = true;
      setStatus("Kamera aktiv – halte den Barcode in das Feld.");
    } catch (err) {
      console.error(err);
      readerContainer.classList.remove("active");
      startBtn.classList.remove("hidden");
      stopBtn.classList.add("hidden");
      setStatus("Kamera konnte nicht gestartet werden (Berechtigung oder HTTPS prüfen).", "err");
    }
  });

  async function stopScanner() {
    if (html5QrCode && isScanning) {
      await html5QrCode.stop();
      isScanning = false;
    }
    readerContainer.classList.remove("active");
    startBtn.classList.remove("hidden");
    stopBtn.classList.add("hidden");
  }

  stopBtn.addEventListener("click", stopScanner);

  document.getElementById("btn-lookup-barcode").addEventListener("click", () => {
    handleScannedCode(document.getElementById("manual-barcode").value);
  });

  loadSettingsUI();
  loadFilamenteFromGitHub();
</script>
</body>
</html>

backend:
  name: github
  repo: hac52/homepage-demo
  branch: main

media_folder: "modelle"
public_folder: "modelle"

collections:
  - name: "shop"
    label: "3D-Druck Shop verwalten"
    files:
      # ==========================================
      # 1. EIGENER REITER: PRODUKTE
      # ==========================================
      - name: "produkte"
        label: "📦 Produkte"
        file: "produkte.json"
        fields:
          - name: "produkte"
            label: "Alle 3D-Druck Produkte"
            widget: "list"
            summary: "{{fields.titel}} ({{fields.farbe}} • {{fields.motto}})"
            fields:
              - { label: "Produkt-ID (ohne Leerzeichen, z.B. drache-bunt)", name: "id", widget: "string" }
              - { label: "Produktname", name: "titel", widget: "string" }
              - { label: "Hauptfarbe (z.B. Orange, Blau, Bunt)", name: "farbe", widget: "string" }
              - { label: "Motto / Kategorie (z.B. Weihnachten, Deko)", name: "motto", widget: "string" }
              - name: "eigenschaften"
                label: "🏷️ Zusätzliche Filter-Werte zuweisen"
                widget: "list"
                required: false
                summary: "{{fields.kategorie}}: {{fields.wert}}"
                fields:
                  - { label: "Filter-Kategorie (exakt wie angelegt, z.B. Material)", name: "kategorie", widget: "string" }
                  - { label: "Zugewiesener Wert (z.B. PLA)", name: "wert", widget: "string" }
              - { label: "Produktfoto", name: "bild", widget: "image" }
              - { label: "Kurzbeschreibung (Startseite, max. 5 Zeilen)", name: "kurzbeschreibung", widget: "text" }
              - { label: "Ausführliche Beschreibung (Detailseite)", name: "beschreibung", widget: "text" }
              - { label: "Maße (z.B. Höhe: 20 cm)", name: "masse", widget: "string", required: false }
              - { label: "Material / Filament (Text für Detailseite)", name: "material", widget: "string", default: "PLA" }
              - { label: "Shopify-Link", name: "shopify", widget: "string", default: "#" }
              - { label: "Etsy-Link", name: "etsy", widget: "string", default: "#" }

      # ==========================================
      # 2. EIGENER REITER: FILTER
      # ==========================================
      - name: "filter"
        label: "🏷️ Filter"
        file: "filter.json"
        fields:
          - name: "farben"
            label: "🎨 Verfügbare Farben (Standard-Filter)"
            widget: "list"
            allow_add: true
            field: { label: "Farbe", name: "farbe", widget: "string" }
          - name: "mottos"
            label: "✨ Verfügbare Mottos (Standard-Filter)"
            widget: "list"
            allow_add: true
            field: { label: "Motto", name: "motto", widget: "string" }
          - name: "zusatzfilter"
            label: "🏷️ Eigene Filter-Kategorien (z.B. Material, Größe, Anlass)"
            widget: "list"
            allow_add: true
            summary: "{{fields.kategorie}}"
            fields:
              - { label: "Name der Filter-Kategorie (z.B. Material)", name: "kategorie", widget: "string" }
              - name: "werte"
                label: "Auswahlmöglichkeiten (z.B. PLA, PETG, Flexibel)"
                widget: "list"
                allow_add: true
                field: { label: "Wert", name: "wert", widget: "string" }

      # ==========================================
      # 3. EIGENER REITER: FILAMENT-SORTIMENT
      # ==========================================
      - name: "filamente"
        label: "🧵 Filament-Sortiment"
        file: "filamente.json"
        fields:
          - name: "filamente"
            label: "Vorhandene Filamente & Farben"
            widget: "list"
            allow_add: true
            summary: "{{fields.name}} ({{fields.material}} • {{fields.verfuegbar}})"
            fields:
              - { label: "Filament-Name / Farbe (z.B. Matt Schwarz, Seide Gold)", name: "name", widget: "string" }
              - { label: "Material-Typ (z.B. PLA, PETG, TPU, ASA)", name: "material", widget: "string", default: "PLA" }
              - { label: "Farb-Code für Vorschau (optional, z.B. #111827)", name: "farbcode", widget: "color", required: false }
              - { label: "Status (z.B. Auf Lager, Wenig Bestand, Leer)", name: "verfuegbar", widget: "string", default: "Auf Lager" }
              - { label: "Notiz / Besonderheit (z.B. Glänzend, Wetterfest)", name: "notiz", widget: "string", required: false }

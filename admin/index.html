<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel – Schicht für Schicht 3D Drucke</title>
  <style>
    .admin-floating-bar {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 99999;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .manager-link {
      background: #111827;
      color: #fff;
      border: 1px solid #374151;
      padding: 12px 18px;
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    .manager-link:hover {
      background: #1f2937;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <script src="./sveltia-cms.js"></script>

  <nav class="admin-floating-bar" aria-label="Management">
    <a class="manager-link" href="./produkt_manager.html" title="Produkte mit Foto und KI verwalten">📦 Produkt Manager</a>
    <a class="manager-link" href="./filament_manager.html" title="Filamentbestand mit Barcode und Foto verwalten">🧵 Filament Manager</a>
  </nav>
</body>
</html>

<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel – Schicht für Schicht 3D Drucke</title>
  <style>
    #ki-scanner-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 99999;
      background: #111827;
      color: #fff;
      border: 1px solid #374151;
      padding: 12px 18px;
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    }
    #ki-scanner-panel {
      position: fixed;
      bottom: 72px;
      left: 20px;
      width: 390px;
      max-width: calc(100vw - 40px);
      max-height: 82vh;
      overflow-y: auto;
      background: #1f2937;
      color: #f9fafb;
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 16px;
      z-index: 99999;
      font-family: system-ui, sans-serif;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      display: none;
      flex-direction: column;
      gap: 8px;
    }
    #ki-scanner-panel.open { display: flex; }
    .ki-label { font-size: 11px; color: #9ca3af; margin-bottom: -4px; }
    .ki-field-row { display: flex; gap: 6px; align-items: center; }
    .ki-field-row input, .ki-field-row textarea {
      flex: 1;
      background: #111827;
      color: #fff;
      border: 1px solid #4b5563;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
    }
    .ki-copy-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <script src="./sveltia-cms.js"></script>

  <button id="ki-scanner-btn" type="button">✨ KI-Produkt-Scanner</button>

  <div id="ki-scanner-panel">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <strong>3D-Druck per Foto erkennen</strong>
      <button id="ki-scanner-close" type="button" style="background:none;border:none;color:#9ca3af;font-size:16px;cursor:pointer;">✕</button>
    </div>

    <input type="file" id="ki-image-input" accept="image/*" style="font-size:13px;">
    <img id="ki-preview" src="" alt="Vorschau" style="max-height:130px; object-fit:contain; display:none; border-radius:6px; background:#111827;">

    <button id="ki-run-btn" type="button" style="background:#10b981; color:#fff; border:none; padding:8px; border-radius:6px; font-weight:600; cursor:pointer;">
      Foto analysieren
    </button>
    <div id="ki-status" style="font-size:12px; color:#d1d5db;"></div>

    <span class="ki-label">Produkt-ID (ohne Leerzeichen)</span>
    <div class="ki-field-row">
      <input type="text" id="ki-out-id" placeholder="z. B. drache-bunt">
      <button type="button" class="ki-copy-btn" data-target="ki-out-id">Kopieren</button>
    </div>

    <span class="ki-label">Produktname (titel)</span>
    <div class="ki-field-row">
      <input type="text" id="ki-out-titel" placeholder="Produktname">
      <button type="button" class="ki-copy-btn" data-target="ki-out-titel">Kopieren</button>
    </div>

    <span class="ki-label">Hauptfarbe (farbe)</span>
    <div class="ki-field-row">
      <input type="text" id="ki-out-farbe" placeholder="z. B. Orange, Blau, Bunt">
      <button type="button" class="ki-copy-btn" data-target="ki-out-farbe">Kopieren</button>
    </div>

    <span class="ki-label">Motto / Kategorie (motto)</span>
    <div class="ki-field-row">
      <input type="text" id="ki-out-motto" placeholder="z. B. Deko, Weihnachten">
      <button type="button" class="ki-copy-btn" data-target="ki-out-motto">Kopieren</button>
    </div>

    <span class="ki-label">Kurzbeschreibung (Startseite)</span>
    <div class="ki-field-row">
      <textarea id="ki-out-kurz" rows="2" placeholder="Max. 2-3 Sätze für die Startseite"></textarea>
      <button type="button" class="ki-copy-btn" data-target="ki-out-kurz">Kopieren</button>
    </div>

    <span class="ki-label">Ausführliche Beschreibung (Detailseite)</span>
    <div class="ki-field-row">
      <textarea id="ki-out-beschreibung" rows="3" placeholder="Ausführliche Produktbeschreibung"></textarea>
      <button type="button" class="ki-copy-btn" data-target="ki-out-beschreibung">Kopieren</button>
    </div>

    <span class="ki-label">Material / Filament</span>
    <div class="ki-field-row">
      <input type="text" id="ki-out-material" placeholder="PLA">
      <button type="button" class="ki-copy-btn" data-target="ki-out-material">Kopieren</button>
    </div>

    <button id="ki-autofill-btn" type="button" style="background:#4f46e5; color:#fff; border:none; padding:9px; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; margin-top:4px;">
      In offenes Sveltia-Produkt übertragen
    </button>
  </div>

  <script>
    const LM_STUDIO_BASE_URL = "https://desktop-uvddnig.tail1dcff0.ts.net/v1";
    const MODEL_NAME = "google/gemma-4-e4b";

    const panel = document.getElementById("ki-scanner-panel");
    const openBtn = document.getElementById("ki-scanner-btn");
    const closeBtn = document.getElementById("ki-scanner-close");
    const fileInput = document.getElementById("ki-image-input");
    const preview = document.getElementById("ki-preview");
    const runBtn = document.getElementById("ki-run-btn");
    const statusEl = document.getElementById("ki-status");
    const autofillBtn = document.getElementById("ki-autofill-btn");

    let base64Image = "";

    openBtn.addEventListener("click", () => panel.classList.toggle("open"));
    closeBtn.addEventListener("click", () => panel.classList.remove("open"));

    document.querySelectorAll(".ki-copy-btn").forEach((btn) => {
      btn.addEventListener("click", () => {
        const el = document.getElementById(btn.dataset.target);
        navigator.clipboard.writeText(el.value);
        const orig = btn.textContent;
        btn.textContent = "✓";
        setTimeout(() => (btn.textContent = orig), 1200);
      });
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement("canvas");
          const scale = Math.min(1, 800 / img.width);
          canvas.width = img.width * scale;
          canvas.height = img.height * scale;
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          base64Image = canvas.toDataURL("image/jpeg", 0.85);
          preview.src = base64Image;
          preview.style.display = "block";
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    runBtn.addEventListener("click", async () => {
      if (!base64Image) {
        statusEl.textContent = "Bitte zuerst ein Produktfoto auswählen.";
        return;
      }
      statusEl.textContent = "Gemma-4 analysiert den 3D-Druck...";
      runBtn.disabled = true;

      try {
        const res = await fetch(`${LM_STUDIO_BASE_URL}/chat/completions`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: MODEL_NAME,
            messages: [
              {
                role: "system",
                content:
                  'Du bist Produktmanager für einen 3D-Druck-Shop ("Schicht für Schicht 3D Drucke"). Analysiere das Foto und antworte AUSSCHLIESSLICH mit einem gültigen JSON-Objekt ohne Markdown-Formatierung in exakt diesem Schema: {"id":"kleinbuchstaben-mit-bindestrich","titel":"...","farbe":"...","motto":"...","kurzbeschreibung":"...","beschreibung":"...","material":"PLA"}'
              },
              {
                role: "user",
                content: [
                  {
                    type: "text",
                    text: "Erstelle anhand des Fotos: 1. id (kleingeschrieben ohne Leerzeichen/Umlaute, z. B. drache-bunt), 2. titel (deutscher Produktname), 3. farbe (Hauptfarbe auf Deutsch, z. B. Schwarz, Weiß, Orange, Bunt), 4. motto (Kategorie wie Deko, Praktisches, Weihnachten, Ostern, Gaming), 5. kurzbeschreibung (knackige 2 Sätze für die Startseite), 6. beschreibung (ausführliche Beschreibung für die Detailseite mit Vorteilen des 3D-Drucks), 7. material (Standard PLA)."
                  },
                  { type: "image_url", image_url: { url: base64Image } }
                ]
              }
            ],
            temperature: 0.3
          })
        });

        const data = await res.json();
        const raw = (data.choices?.[0]?.message?.content || "").replace(/```json|```/g, "").trim();
        const parsed = JSON.parse(raw);

        document.getElementById("ki-out-id").value = parsed.id || "";
        document.getElementById("ki-out-titel").value = parsed.titel || "";
        document.getElementById("ki-out-farbe").value = parsed.farbe || "";
        document.getElementById("ki-out-motto").value = parsed.motto || "";
        document.getElementById("ki-out-kurz").value = parsed.kurzbeschreibung || "";
        document.getElementById("ki-out-beschreibung").value = parsed.beschreibung || "";
        document.getElementById("ki-out-material").value = parsed.material || "PLA";

        statusEl.textContent = "Analyse fertig! Jetzt unten auf Übertragen klicken.";
      } catch (err) {
        console.error(err);
        statusEl.textContent = "Fehler bei der Analyse. Prüfe, ob das Modell in LM Studio geladen ist.";
      } finally {
        runBtn.disabled = false;
      }
    });

    function getAllDeepInputs(root = document) {
      let results = [];
      const walker = document.createTreeWalker(root, NodeFilter.SHOW_ELEMENT);
      let node;
      while ((node = walker.nextNode())) {
        if ((node.tagName === "INPUT" || node.tagName === "TEXTAREA") && !node.closest("#ki-scanner-panel")) {
          results.push(node);
        }
        if (node.shadowRoot) {
          results = results.concat(getAllDeepInputs(node.shadowRoot));
        }
      }
      return results;
    }

    function getFieldLabel(el) {
      const root = el.getRootNode();
      if (el.id && root.querySelector) {
        const lbl = root.querySelector(`label[for="${CSS.escape(el.id)}"]`);
        if (lbl) return lbl.textContent.toLowerCase();
      }
      if (el.getAttribute("aria-labelledby") && root.getElementById) {
        const lbl = root.getElementById(el.getAttribute("aria-labelledby"));
        if (lbl) return lbl.textContent.toLowerCase();
      }
      let parent = el.parentElement;
      for (let i = 0; i < 5 && parent; i++) {
        const heading = parent.querySelector("label, [id*='label'], header, h3, h4");
        if (heading && heading.textContent.trim().length > 2) {
          return heading.textContent.toLowerCase();
        }
        parent = parent.parentElement;
      }
      return (el.getAttribute("aria-label") || el.name || "").toLowerCase();
    }

    function setNativeValue(el, value) {
      const proto = el.tagName === "TEXTAREA" ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
      const setter = Object.getOwnPropertyDescriptor(proto, "value")?.set;
      if (setter) setter.call(el, value);
      else el.value = value;
      el.dispatchEvent(new Event("input", { bubbles: true, composed: true }));
      el.dispatchEvent(new Event("change", { bubbles: true, composed: true }));
    }

    autofillBtn.addEventListener("click", () => {
      const mapping = [
        { labelMatch: "produkt-id", value: document.getElementById("ki-out-id").value },
        { labelMatch: "produktname", value: document.getElementById("ki-out-titel").value },
        { labelMatch: "hauptfarbe", value: document.getElementById("ki-out-farbe").value },
        { labelMatch: "motto / kategorie", value: document.getElementById("ki-out-motto").value },
        { labelMatch: "kurzbeschreibung", value: document.getElementById("ki-out-kurz").value },
        { labelMatch: "ausführliche beschreibung", value: document.getElementById("ki-out-beschreibung").value },
        { labelMatch: "material / filament", value: document.getElementById("ki-out-material").value }
      ];

      const allFields = getAllDeepInputs(document);
      let filledCount = 0;

      for (const item of mapping) {
        if (!item.value) continue;
        const matches = allFields.filter((f) => getFieldLabel(f).includes(item.labelMatch));
        const target = matches[matches.length - 1];
        if (target) {
          setNativeValue(target, item.value);
          filledCount++;
        }
      }

      statusEl.textContent =
        filledCount > 0
          ? `${filledCount} Felder in Sveltia CMS ausgefüllt!`
          : "Keine offenen Felder gefunden – bitte zuerst in Sveltia ein Produkt aufklappen.";
    });
  </script>
</body>
</html>

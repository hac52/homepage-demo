<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel – Schicht für Schicht 3D Drucke</title>
  <style>
    .admin-floating-bar { position:fixed; bottom:20px; left:20px; z-index:99999; display:flex; gap:10px; flex-wrap:wrap; }
    #ki-scanner-btn, .admin-link { background:#111827; color:#fff; border:1px solid #374151; padding:12px 18px; border-radius:999px; font-family:system-ui,sans-serif; font-size:14px; font-weight:600; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.3); text-decoration:none; display:inline-flex; align-items:center; gap:6px; transition:transform .15s ease,background .15s ease; }
    #ki-scanner-btn:hover, .admin-link:hover { background:#1f2937; transform:translateY(-1px); }
    #ki-scanner-panel { position:fixed; bottom:76px; left:20px; width:440px; max-width:calc(100vw - 40px); max-height:85vh; overflow-y:auto; background:#1f2937; color:#f9fafb; border:1px solid #374151; border-radius:12px; padding:16px; z-index:99999; font-family:system-ui,sans-serif; box-shadow:0 10px 25px rgba(0,0,0,.4); display:none; flex-direction:column; gap:8px; }
    #ki-scanner-panel.open { display:flex; }
    .ki-field-row { display:flex; gap:6px; align-items:center; }
    #ki-chat-input { flex:1; background:#111827; color:#fff; border:1px solid #4b5563; border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit; }
    #ki-chat-box { background:#111827; border:1px solid #374151; border-radius:8px; padding:10px; height:260px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; font-size:13px; }
    .ki-chat-msg { padding:8px 10px; border-radius:8px; max-width:85%; line-height:1.4; word-wrap:break-word; }
    .ki-chat-msg.user { background:#2563eb; color:#fff; align-self:flex-end; }
    .ki-chat-msg.bot { background:#374151; color:#f9fafb; align-self:flex-start; }
    @media (max-width:480px) { .admin-floating-bar { left:12px; right:12px; bottom:12px; } #ki-scanner-panel { left:12px; bottom:70px; max-width:calc(100vw - 24px); } }
  </style>
</head>
<body>
  <script src="./sveltia-cms.js"></script>

  <div class="admin-floating-bar">
    <button id="ki-scanner-btn" type="button">✨ KI-Admin-Assistent</button>
    <a class="admin-link" href="./produkt_manager.html" title="Produkt Manager öffnen">📦 Produkt Manager</a>
    <a class="admin-link" href="./filament_manager.html" title="Filament Manager öffnen">🧵 Filament Manager</a>
  </div>

  <div id="ki-scanner-panel">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <strong>✨ KI-Admin-Assistent</strong>
      <button id="ki-scanner-close" type="button" style="background:none;border:none;color:#9ca3af;font-size:16px;cursor:pointer;">✕</button>
    </div>
    <div id="tab-chat" class="ki-section active">
      <div id="ki-chat-box"><div class="ki-chat-msg bot">Hallo! Frag mich alles zu deinem aktuellen Produkt-Sortiment, deinen Filtern oder deinem Filament-Bestand.</div></div>
      <div class="ki-field-row">
        <input type="text" id="ki-chat-input" placeholder="Frage zum Bestand oder Sortiment...">
        <button type="button" id="ki-chat-send" style="background:#10b981;color:#fff;border:none;border-radius:6px;padding:7px 12px;font-weight:600;cursor:pointer;">Fragen</button>
      </div>
      <button type="button" id="ki-chat-clear" style="background:none;border:none;color:#9ca3af;font-size:11px;text-align:right;cursor:pointer;padding:0;">Verlauf löschen</button>
    </div>
  </div>
  <script src="./admin-assistent.js" defer></script>
</body>
</html>
